<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>吴越 | Yue Wu</title>
<link rel="stylesheet" href="landing.css">
</head>
<body>
<main class="card">
  <div class="top">
    <div>
      <h1>吴越 <span style="display:block;font-size:18px;color:#697382;font-weight:500;margin-top:6px;">Yue Wu</span></h1>
      <p>请选择浏览方式与主页版本</p>
    </div>
    <img src="avatar.jpg" alt="吴越">
  </div>

  <section class="step active" id="step1">
    <div class="kicker">STEP 1 / 2</div>
    <h2>选择浏览方式</h2>
    <p class="desc">你可以先决定使用桌面版还是移动版浏览。</p>
    <div class="options">
      <button class="opt" data-device="desktop"><strong>Web / 桌面版</strong><span>适合电脑与大屏查看，页面宽度更大。</span></button>
      <button class="opt" data-device="mobile"><strong>Mobile / 移动版</strong><span>适合手机与窄屏查看，页面单栏展开。</span></button>
    </div>
  </section>

  <section class="step" id="step2">
    <div class="kicker">STEP 2 / 2</div>
    <h2>选择主页版本</h2>
    <p class="desc">两版内容一致，只是展示顺序不同。</p>
    <div class="options">
      <button class="opt" data-version="job"><strong>求职版</strong><span>优先展示实习、项目、竞赛与技能。</span></button>
      <button class="opt" data-version="academic"><strong>学术版</strong><span>优先展示论文、工作论文、项目与学术会议。</span></button>
    </div>
    <button class="back" id="backBtn">← 返回上一步</button>
  </section>

  <div class="tip">正文页面中的实习、项目、论文、竞赛等详细说明均支持“折叠 / 展开”。</div>
</main>
<script src="landing.js"></script>
</body>
</html>
